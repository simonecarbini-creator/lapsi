<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Test — ripetute-calc</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #101828; }
  h1 { font-size: 1.2rem; }
  .pass { color: #1d7a5d; }
  .fail { color: #ba3838; font-weight: 700; }
  #summary { font-weight: 700; font-size: 1.05rem; margin: 16px 0; }
  ul { padding-left: 20px; }
  li { margin: 4px 0; font-family: ui-monospace, monospace; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Test — ripetute-calc.js</h1>
<p>Riesegui questa pagina (apertura diretta nel browser, nessun server richiesto) ogni volta
che si ritocca un coefficiente in <code>ripetute-calc.js</code>.</p>
<div id="summary">In corso…</div>
<ul id="results"></ul>

<script src="ripetute-calc.js"></script>
<script>
(function () {
  const results = [];
  let pass = 0;
  let fail = 0;

  function assertEqual(actual, expected, label) {
    const ok = actual === expected;
    results.push({ ok, label, actual, expected });
    if (ok) pass += 1; else fail += 1;
  }

  // --- Casi di verifica dalla spec (1000 = 4'00", T = 240) ---
  const T = RipeteCalc.parseThousand('4:00');
  assertEqual(T, 240, 'parseThousand("4:00") === 240');

  const cases = [
    { vol: 2, rec: 90, expect: ['44″', '1′08″', '1′33″', '2′00″', '2′28″'] },
    { vol: 2, rec: 120, expect: ['43″5', '1′07″', '1′33″', '1′59″', '2′27″'] },
    { vol: 4, rec: 120, expect: ['46″', '1′12″', '1′38″', '2′06″', '2′35″'] },
    { vol: 5, rec: 120, expect: ['48″', '1′14″', '1′42″', '2′10″', '2′40″'] },
  ];

  cases.forEach(({ vol, rec, expect }) => {
    const times = RipeteCalc.repeatTimesFor(T, vol, rec).map((r) => RipeteCalc.formatSeconds(r.seconds));
    expect.forEach((exp, i) => {
      const dist = RipeteCalc.PCT[i][0];
      assertEqual(times[i], exp, `vol=${vol}km rec=${rec}s dist=${dist}m -> ${exp}`);
    });
  });

  // --- Formattazione: casi limite attorno a 59,75s ---
  assertEqual(RipeteCalc.formatSeconds(39.0), '39″', 'formatSeconds(39.0) === "39″"');
  assertEqual(RipeteCalc.formatSeconds(44.5), '44″5', 'formatSeconds(44.5) === "44″5"');
  assertEqual(RipeteCalc.formatSeconds(59.7), '59″5', 'formatSeconds(59.7) === "59″5" (sotto soglia, mezzo secondo)');
  assertEqual(RipeteCalc.formatSeconds(59.8), '1′00″', 'formatSeconds(59.8) === "1′00″" (sopra soglia, secondo intero)');
  assertEqual(RipeteCalc.formatSeconds(65), '1′05″', 'formatSeconds(65) === "1′05″"');

  // --- formatLabel ---
  assertEqual(RipeteCalc.formatLabel(240), '4′00″', 'formatLabel(240) === "4′00″"');
  assertEqual(RipeteCalc.formatLabel(185), '3′05″', 'formatLabel(185) === "3′05″"');

  // --- parseThousand: casi validi e invalidi ---
  assertEqual(RipeteCalc.parseThousand('347'), 227, 'parseThousand("347") === 227');
  assertEqual(RipeteCalc.parseThousand("3'47"), 227, 'parseThousand("3\'47") === 227');
  assertEqual(RipeteCalc.parseThousand('3:47'), 227, 'parseThousand("3:47") === 227');
  assertEqual(RipeteCalc.parseThousand('0347'), 227, 'parseThousand("0347") === 227 (4 cifre)');
  assertEqual(RipeteCalc.parseThousand(''), null, 'parseThousand("") === null');
  assertEqual(RipeteCalc.parseThousand('47'), null, 'parseThousand("47") === null (meno di 3 cifre)');
  assertEqual(RipeteCalc.parseThousand('34567'), null, 'parseThousand("34567") === null (più di 4 cifre)');
  assertEqual(RipeteCalc.parseThousand('399'), null, 'parseThousand("399") === null (99s non valido)');
  assertEqual(RipeteCalc.parseThousand('1347'), null, 'parseThousand("1347") === null (13 min > 12)');
  assertEqual(RipeteCalc.parseThousand('0047'), null, 'parseThousand("0047") === null (0 min < 1)');

  // --- isValidVol / isValidRec ---
  assertEqual(RipeteCalc.isValidVol(2), true, 'isValidVol(2) === true');
  assertEqual(RipeteCalc.isValidVol(2.7), false, 'isValidVol(2.7) === false');
  assertEqual(RipeteCalc.isValidRec(90), true, 'isValidRec(90) === true');
  assertEqual(RipeteCalc.isValidRec(100), false, 'isValidRec(100) === false');

  // --- "Giorno di forza": volume equivalente di salite/gradoni/balzi ---
  assertEqual(RipeteCalc.strengthIntensity('gradoni-corsa'), 2.2, 'strengthIntensity("gradoni-corsa") === 2.2');
  assertEqual(RipeteCalc.strengthIntensity('non-esiste'), null, 'strengthIntensity("non-esiste") === null');

  // 10 serie da 20" di gradoni = 200" totali, senza i recuperi (caso dalla spec).
  const gradoniSeconds = RipeteCalc.strengthExerciseSeconds({ serieSeconds: 20, numSerie: 10 });
  assertEqual(gradoniSeconds, 200, '10x20" di gradoni === 200" totali');
  assertEqual(Math.round(RipeteCalc.strengthVolumeEquivalent(gradoniSeconds, 'gradoni-corsa')), 1540, 'volEquivalente(200", gradoni-corsa) === 1540 m');

  // 1 minuto a intensità 1,0 deve valere 210 m (il senso del fattore 3,5).
  assertEqual(60 * 1.0 * RipeteCalc.STRENGTH_SCALE, 210, "1' a intensità 1,0 === 210 m");

  // Discesa di corsa: conta a metà; se non c'è (camminata) non va passata.
  const withDescent = RipeteCalc.strengthExerciseSeconds({ serieSeconds: 0, numSerie: 1, descentRunSeconds: 10 });
  assertEqual(withDescent, 5, 'discesa di corsa di 10" conta per 5"');
  const noDescent = RipeteCalc.strengthExerciseSeconds({ serieSeconds: 20, numSerie: 3 });
  assertEqual(noDescent, 60, 'senza discesa, 3x20" === 60" (nessun contributo extra)');

  // Metri -> secondi per gli esercizi che accettano la distanza.
  assertEqual(Math.round(RipeteCalc.strengthSecondsFromMeters('salita-media', 100) * 100) / 100, 41.67, 'strengthSecondsFromMeters("salita-media", 100) ≈ 41,67"');
  assertEqual(RipeteCalc.strengthSecondsFromMeters('jumping-squat', 100), 0, 'strengthSecondsFromMeters su un esercizio senza velocità stimata === 0');

  assertEqual(RipeteCalc.strengthVolumeEquivalent(0, 'skip'), 0, 'strengthVolumeEquivalent(0, ...) === 0');
  assertEqual(RipeteCalc.strengthVolumeEquivalent(100, 'non-esiste'), 0, 'strengthVolumeEquivalent con chiave sconosciuta === 0');

  // --- render ---
  const list = document.getElementById('results');
  results.forEach((r) => {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = (r.ok ? '✓ ' : `✗ (atteso ${JSON.stringify(r.expected)}, ottenuto ${JSON.stringify(r.actual)}) `) + r.label;
    list.appendChild(li);
  });
  document.getElementById('summary').innerHTML = fail === 0
    ? `<span class="pass">Tutti i ${pass} test passano.</span>`
    : `<span class="fail">${fail} test falliti</span> su ${pass + fail} (${pass} passati).`;
  document.title = (fail === 0 ? 'PASS' : 'FAIL') + ' — Test ripetute-calc';
})();
</script>
</body>
</html>
